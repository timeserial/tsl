[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcnet"
version = "0.1.0"
description = "Rede preditiva hierárquica esparsa — protótipo Phase 0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Só para `scripts/benchmark.py`. O pacote em si continua a depender apenas de
# NumPy — o torch existe aqui para as *linhas de base* serem as verdadeiras e
# não versões escritas à mão por quem tem interesse no resultado.
bench = ["torch>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
